<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLTG RECORDS | SUBMIT</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <meta property="og:title" content="VLTG RECORDS">
    <meta property="og:description" content="Official Demo Submission Portal.">
    <meta property="og:image" content="logo.png"> 
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 20%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.1) 0%, transparent 50%),
                        #0a0a0a url('https://www.transparenttextures.com/patterns/concrete-wall.png');
            color: #ffffff; font-family: 'Kanit', sans-serif; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 0, 0.2); border-radius: 24px;
            padding: 40px 30px; width: 100%; max-width: 450px; text-align: center;
        }
        .logo-img { width: 130px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(57, 255, 20, 0.4)); }
        h1 { font-weight: 800; font-size: 2rem; text-transform: uppercase; 
             background: linear-gradient(90deg, #39FF14, #00C6FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #ccc; margin-bottom: 30px; font-size: 0.95rem; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; text-transform: uppercase; font-weight: 600; }
        input { width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.5); border: 2px solid transparent; border-radius: 12px; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }
        button { width: 100%; padding: 18px; border: none; border-radius: 12px; background: linear-gradient(90deg, #39FF14, #00C6FF);
                 color: #000; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="VLTG Logo" class="logo-img">
        <h1>VLTG Records</h1>
        <p>SEND US YOUR BEST WORK</p>
        <form id="vltg-form">
            <div class="input-group">
                <label>Artist Name</label>
                <input type="text" name="artistName" required placeholder="Who are you?">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="Where do we reply?">
            </div>
            <div class="input-group">
                <label>Private Link</label>
                <input type="url" name="trackLink" required placeholder="SoundCloud / Drive Link">
            </div>
            <button type="submit" id="submit-btn">Submit Demo</button>
        </form>
    </div>

    <script>
      var form = document.getElementById("vltg-form");
      form.addEventListener("submit", async function(event) {
        event.preventDefault();
        var status = document.getElementById("submit-btn");
        var data = new FormData(event.target);
        status.innerHTML = "SENDING...";
        status.disabled = true;

        // AJAX connection to Formspree
        fetch("https://formspree.io/f/xqeqvbgk", {
          method: "POST",
          body: data,
          headers: { 'Accept': 'application/json' }
        }).then(response => {
          if (response.ok) {
            // Success redirect
            window.location.href = "success.html"; 
          } else {
            status.innerHTML = "ERROR! TRY AGAIN.";
            status.disabled = false;
          }
        }).catch(error => {
          status.innerHTML = "CONNECTION ERROR.";
          status.disabled = false;
        });
      });
    </script>
</body>
</html>
