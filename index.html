<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VLTG Records – Demo Submission</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0c0c0c, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eaeaea;
    }

    .card {
      width: 360px;
      padding: 32px;
      border-radius: 22px;
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid rgba(0, 255, 140, 0.35);
      box-shadow:
        0 0 28px rgba(0,255,140,0.18),
        inset 0 0 20px rgba(0,255,140,0.08);
      position: relative;
      overflow: hidden;
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0,255,140,0.6));
    }

    h1 {
      text-align: center;
      font-size: 24px;
      letter-spacing: 1.8px;
      margin: 6px 0 4px;
      color: #00ff8c;
    }

    .subtitle {
      text-align: center;
      font-size: 11px;
      opacity: 0.55;
      margin-bottom: 26px;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    input:focus {
      border-color: #00ff8c;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: #00ff8c;
      color: #000;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 13px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .follow {
      margin-top: 20px;
      text-align: center;
    }

    .follow a {
      font-size: 11px;
      letter-spacing: 1px;
      text-decoration: none;
      color: #00ff8c;
      opacity: 0.75;
    }

    .screen {
      transition: opacity 0.4s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      inset: 32px;
    }

    .thankyou {
      text-align: center;
    }

    .check {
      font-size: 42px;
      color: #00ff8c;
      margin-bottom: 14px;
    }

    .thankyou p {
      font-size: 13px;
      opacity: 0.75;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- FORM SCREEN -->
    <form id="demoForm" class="screen">
      <div class="logo">
        <img src="logo.png" alt="VLTG Records Logo">
      </div>

      <h1>VLTG RECORDS</h1>
      <div class="subtitle">DEMO SUBMISSIONS</div>

      <input type="text" placeholder="ARTIST NAME" required>
      <input type="email" placeholder="EMAIL" required>
      <input type="text" placeholder="TRACK LINK (SoundCloud / Drive)" required>

      <button type="submit">SEND DEMO</button>

      <div class="follow">
        <a href="https://instagram.com/vltgrecords" target="_blank">
          FOLLOW @VLTGRECORDS
        </a>
      </div>
    </form>

    <!-- THANK YOU SCREEN -->
    <div id="thankYouScreen" class="screen hidden thankyou">
      <div class="check">✓</div>
      <h1>THANK YOU</h1>
      <p>
        Thank you for sending your demo.<br>
        We’ll be listening to it soon.
      </p>
    </div>

  </div>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <script>
    (function () {
      emailjs.init("Dq6SIXC7zmUHhLQ7j");
    })();

    const form = document.getElementById("demoForm");
    const thankYou = document.getElementById("thankYouScreen");
    const button = form.querySelector("button");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      button.disabled = true;

      const artistName = form.querySelector('input[placeholder="ARTIST NAME"]').value;
      const artistEmail = form.querySelector('input[type="email"]').value;
      const trackLink = form.querySelector('input[placeholder^="TRACK"]').value;

      emailjs.send(
        "service_kc0wjba",
        "template_opaptos",
        {
          artist_name: artistName,
          artist_email: artistEmail,
          track_link: trackLink
        }
      ).then(
        function () {
          form.classList.add("hidden");
          thankYou.classList.remove("hidden");
        },
        function (error) {
          console.error("EmailJS error:", error);
          alert("Something went wrong. Please try again.");
          button.disabled = false;
        }
      );
    });
  </script>

</body>
</html>
