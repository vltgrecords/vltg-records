<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VLTG Records – Demo Submission</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #0e0e0e, #000),
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 1px,
          transparent 1px,
          transparent 4px
        );
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    /* floating neon fog */
    body::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(0,255,140,0.18), transparent 60%);
      filter: blur(140px);
      animation: drift 10s ease-in-out infinite;
    }

    @keyframes drift {
      0% { transform: translateY(0); }
      50% { transform: translateY(-60px); }
      100% { transform: translateY(0); }
    }

    .card {
      position: relative;
      width: 360px;
      padding: 30px;
      border-radius: 26px;
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(18px);
      border: 2px solid transparent;
      background-clip: padding-box;
      box-shadow:
        0 0 45px rgba(0,255,140,0.35),
        inset 0 0 25px rgba(0,255,140,0.12);
    }

    /* animated neon outline */
    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 28px;
      background: linear-gradient(120deg, #00ff99, #00c6ff, #00ff99);
      filter: blur(8px);
      opacity: 0.7;
      z-index: -1;
      animation: glowmove 6s linear infinite;
    }

    @keyframes glowmove {
      0% { filter: blur(8px) hue-rotate(0deg); }
      100% { filter: blur(8px) hue-rotate(360deg); }
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(0,255,140,0.9);
    }

    .logo img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0,255,140,0.8));
    }

    h1 {
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      margin: 8px 0 4px;
      color: #00ff99;
      text-shadow: 0 0 14px rgba(0,255,140,0.85);
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      opacity: 0.65;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #00ff99;
      box-shadow: 0 0 14px rgba(0,255,140,0.6);
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 800;
      cursor: pointer;
      color: #000;
      background: linear-gradient(90deg, #00ff99, #00c6ff);
      box-shadow: 0 0 30px rgba(0,255,140,0.8);
      transition: 0.15s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 45px rgba(0,255,140,1);
    }

    .follow {
      margin-top: 18px;
      text-align: center;
    }

    .follow a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 1px;
      text-decoration: none;
      color: #00ff99;
      border: 1px solid rgba(0,255,140,0.5);
      box-shadow: inset 0 0 10px rgba(0,255,140,0.2);
      transition: 0.2s;
    }

    .follow a:hover {
      background: rgba(0,255,140,0.15);
      box-shadow: 0 0 20px rgba(0,255,140,0.6);
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <img src="logo.png" alt="VLTG Records Logo">
    </div>

    <h1>VLTG RECORDS</h1>
    <div class="subtitle">DEMO SUBMISSIONS OPEN</div>

    <input type="text" placeholder="ARTIST NAME">
    <input type="email" placeholder="EMAIL">
    <input type="text" placeholder="TRACK LINK (SoundCloud / Drive)">

    <button>SEND DEMO</button>

    <div class="follow">
      <a href="https://instagram.com/vltgrecords" target="_blank">
        FOLLOW @VLTGRECORDS
      </a>
    </div>

  </div>

</body>
</html>
