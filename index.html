<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLTG RECORDS | SUBMIT</title>
<link href="" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: radial-gradient(circle at 20% 20%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.1) 0%, transparent 50%),
#0a0a0a url('');
color: #ffffff; font-family: 'Kanit', sans-serif; min-height: 100vh;
display: flex; align-items: center; justify-content: center; padding: 20px;
}
.card {
background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px);
border: 1px solid rgba(0, 255, 0, 0.2); border-radius: 24px;
padding: 40px 30px; width: 100%; max-width: 450px; text-align: center;
}
h1 { font-weight: 800; font-size: 2rem; background: linear-gradient(90deg, #39FF14, #00C6FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: #ccc; margin-bottom: 30px; }
input { width: 100%; padding: 16px; margin-bottom: 20px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; outline: none; }
input:focus { border-color: #39FF14; }
button { width: 100%; padding: 18px; border-radius: 12px; border: none; background: linear-gradient(90deg, #39FF14, #00C6FF); font-weight: 800; color: #000; cursor: pointer; text-transform: uppercase; }
.insta-btn { margin-top: 25px; display: inline-block; color: #fff; text-decoration: none; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.3); padding: 10px 20px; border-radius: 50px; transition: 0.3s; }
.insta-btn:hover { border-color: #39FF14; color: #39FF14; }
</style>
</head>
<body>
<div class="card">
<h1>VLTG Records</h1>
<p>SEND US YOUR BEST WORK</p>
<form id="vltg-form">
<input type="text" name="artistName" required placeholder="Artist Name">
<input type="email" name="email" required placeholder="Email">
<input type="url" name="trackLink" required placeholder="SoundCloud / Drive Link">
<button type="submit" id="submit-btn">Submit Demo</button>
</form>
<a href="" target="_blank" class="insta-btn">Follow @vltgrecords</a>
</div>
<script>
document.getElementById("vltg-form").addEventListener("submit", function(e) {
e.preventDefault();
var btn = document.getElementById("submit-btn");
btn.innerHTML = "SENDING...";
btn.disabled = true;
fetch("", {
method: "POST",
body: new FormData(e.target),
headers: { 'Accept': 'application/json' }
}).then(res => {
if (res.ok) {
// This is the auto-redirect to your IG
window.location.href = "";
}
else {
btn.innerHTML = "ERROR! TRY AGAIN";
btn.disabled = false;
}
}).catch(err => {
btn.innerHTML = "CONNECTION ERROR";
btn.disabled = false;
});
});
</script>
</body>
</html>
