<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLTG RECORDS | SUBMIT</title>
<link href="" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: radial-gradient(circle at 20% 20%, rgba(57, 255, 20, 0.05) 0%, transparent 50%),
radial-gradient(circle at 80% 80%, rgba(0, 198, 255, 0.05) 0%, transparent 50%),
#050505;
color: #ffffff; font-family: 'Kanit', sans-serif; min-height: 100vh;
display: flex; align-items: center; justify-content: center; padding: 20px;
}
.card {
background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px);
border: 1px solid rgba(57, 255, 20, 0.3); border-radius: 24px;
padding: 40px 30px; width: 100%; max-width: 450px; text-align: center;
box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(57, 255, 20, 0.1);
}
.logo-img { width: 130px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(57, 255, 20, 0.5)); }
h1 { font-weight: 800; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px;
background: linear-gradient(90deg, #39FF14, #00C6FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: #888; margin-bottom: 30px; font-size: 0.9rem; letter-spacing: 3px; font-weight: 300; }

</head>
<body>
<div class="card">
<img src="logo.png" alt="VLTG Logo" class="logo-img">
<h1>VLTG Records</h1>
<p>DEMO SUBMISSION</p>

</body>
</html>
