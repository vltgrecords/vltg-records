<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VLTG Records – Demo Submissions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0c0c0c, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eaeaea;
    }

    .card {
      width: 360px;
      padding: 32px;
      border-radius: 22px;
      background: rgba(10,10,10,0.9);
      border: 1px solid rgba(0,255,140,0.35);
      box-shadow: 0 0 28px rgba(0,255,140,0.18);
    }

    .logo {
      width: 90px;
      margin: 0 auto 14px;
    }

    .logo img {
      width: 100%;
      filter: drop-shadow(0 0 12px rgba(0,255,140,0.6));
    }

    h1 {
      text-align: center;
      color: #00ff8c;
      margin: 6px 0;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 18px;
    }

    .rules {
      font-size: 11px;
      opacity: 0.65;
      text-align: center;
      margin-bottom: 22px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    input:focus { border-color: #00ff8c; }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #00ff8c;
      color: #000;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .follow-btn {
      margin-top: 10px;
      background: transparent;
      color: #00ff8c;
      border: 1px solid rgba(0,255,140,0.5);
      font-size: 12px;
    }

    .follow-btn:hover {
      background: #00ff8c;
      color: #000;
      box-shadow: 0 0 14px rgba(0,255,140,0.5);
    }

    .tooltip {
      font-size: 10px;
      text-align: center;
      margin-top: 8px;
      opacity: 0.55;
      min-height: 14px;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      opacity: 0.65;
      white-space: nowrap;
    }

    .footer a {
      color: #00ff8c;
      text-decoration: none;
      margin: 0 4px;
    }

    #cookieBanner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0b0b0b;
      color: #fff;
      padding: 14px;
      transform: translateY(100%);
      transition: 0.4s;
    }

    #cookieBanner.show { transform: translateY(0); }
  </style>
</head>

<body>

<div class="card">
  <div class="logo">
    <img src="logo.png">
  </div>

  <h1>VLTG RECORDS</h1>
  <div class="subtitle">DEMO SUBMISSIONS</div>

  <div class="rules">
    Unreleased tracks only.<br>
    SoundCloud or private file links only.<br>
    No remixes or bootlegs.
  </div>

  <input type="text" id="name" placeholder="ARTIST NAME">
  <input type="email" id="email" placeholder="EMAIL">
  <input type="url" id="track" placeholder="SOUNDCLOUD / DRIVE / DROPBOX LINK">

  <button id="submitBtn" onclick="sendDemo()" disabled>SEND DEMO</button>

  <a href="https://instagram.com/vltgrecords" target="_blank">
    <button class="follow-btn">Follow @vltgrecords</button>
  </a>

  <div class="tooltip" id="tooltip">
    Fill all fields & choose cookie preference
  </div>

  <div class="footer">
    <a href="terms.html">Terms of Use</a> |
    <a href="privacy.html">Privacy Policy</a> |
    <a href="cookies.html">Cookie Policy</a>
  </div>
</div>

<div id="cookieBanner">
  We use cookies.
  <button onclick="acceptCookies()">Accept</button>
  <button onclick="denyCookies()">Deny</button>
</div>

<script>
emailjs.init("Dq6SIXC7zmUHhLQ7j");

const inputs = document.querySelectorAll("input");
const btn = document.getElementById("submitBtn");
const tooltip = document.getElementById("tooltip");

function hasCookieDecision() {
  return localStorage.getItem("vltg_cookie_consent");
}

function isValidTrackLink(url) {
  return url.includes("soundcloud.com") ||
         url.includes("drive.google.com") ||
         url.includes("dropbox.com");
}

function checkForm() {
  let filled = true;
  inputs.forEach(i => { if (!i.value.trim()) filled = false; });

  const track = document.getElementById("track").value.trim();

  if (!filled) {
    btn.disabled = true;
    tooltip.textContent = "Fill all fields";
    return;
  }

  if (!isValidTrackLink(track)) {
    btn.disabled = true;
    tooltip.textContent = "Use SoundCloud, Drive or Dropbox links";
    return;
  }

  if (!hasCookieDecision()) {
    btn.disabled = true;
    tooltip.textContent = "Accept cookies to continue";
    return;
  }

  btn.disabled = false;
  tooltip.textContent = "Ready to submit";
}

inputs.forEach(i => i.addEventListener("input", checkForm));

function sendDemo() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const track = document.getElementById("track").value.trim();

  if (!name || !email || !track) return;

  btn.innerText = "SENDING...";
  btn.disabled = true;

  emailjs.send("service_kc0wjba", "template_opaptos", {
    artist_name: name,
    artist_email: email,
    track_link: track
  }).then(() => {
    btn.innerText = "SENT ✓";
    tooltip.textContent = "Demo submitted!";
  }).catch((err) => {
    console.error(err);
    btn.innerText = "SEND DEMO";
    btn.disabled = false;
    tooltip.textContent = "Error. Try again.";
  });
}

function acceptCookies() {
  localStorage.setItem("vltg_cookie_consent", "accepted");
  document.getElementById("cookieBanner").classList.remove("show");
  checkForm();
}

function denyCookies() {
  localStorage.setItem("vltg_cookie_consent", "denied");
  document.getElementById("cookieBanner").classList.remove("show");
  checkForm();
}

window.onload = () => {
  if (!hasCookieDecision()) {
    document.getElementById("cookieBanner").classList.add("show");
  }
  checkForm();
};
</script>

</body>
</html>
