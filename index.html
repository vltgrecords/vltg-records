<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VLTG Records – Demo Submission</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #0b0b0b, #000000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    /* subtle animated background glow */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,255,120,0.15), transparent 60%);
      filter: blur(120px);
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-40px); }
      100% { transform: translateY(0px); }
    }

    .card {
      position: relative;
      width: 340px;
      padding: 28px;
      border-radius: 22px;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 255, 140, 0.4);
      box-shadow:
        0 0 40px rgba(0,255,140,0.25),
        inset 0 0 20px rgba(0,255,140,0.15);
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 0 25px rgba(0,255,140,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #00ff99;
      font-size: 18px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      margin: 10px 0 4px;
      color: #00ff99;
      text-shadow: 0 0 12px rgba(0,255,140,0.8);
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    input:focus {
      border-color: #00ff99;
      box-shadow: 0 0 10px rgba(0,255,140,0.5);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #000;
      background: linear-gradient(90deg, #00ff99, #00c6ff);
      box-shadow: 0 0 20px rgba(0,255,140,0.7);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0,255,140,0.9);
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      opacity: 0.5;
    }

    .footer span {
      color: #00ff99;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">VLTG</div>

    <h1>VLTG RECORDS</h1>
    <div class="subtitle">DEMO SUBMISSION</div>

    <input type="text" placeholder="ARTIST NAME">
    <input type="email" placeholder="EMAIL">
    <input type="text" placeholder="TRACK LINK (SoundCloud / Drive)">

    <button>SEND DEMO</button>

    <div class="footer">
      FOLLOW <span>@VLTGRECORDS</span>
    </div>
  </div>

</body>
</html>
